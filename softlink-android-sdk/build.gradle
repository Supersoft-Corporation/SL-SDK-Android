plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'com.vanniktech.maven.publish'
}

android {
    namespace 'com.supersoftcorporation.softlink'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.0.16"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.google.android.gms:play-services-appset:16.0.2'
    implementation 'com.android.installreferrer:installreferrer:2.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'
}
mavenPublishing {
    configure(new com.vanniktech.maven.publish.AndroidSingleVariantLibrary(
            "release",    // variant
            true,         // sourcesJar
            false         // publishJavadocJar = false — skip Dokka
    ))

    coordinates(
            'com.supersoftcorporation',
            'softlink-android-sdk',
            '0.0.16'
    )

    publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL)
    signAllPublications()

    pom {
        name = 'SoftLink Android SDK'
        description = 'Official Android SDK for SoftLink — Deep Link Management Platform'
        url = 'https://github.com/Supersoft-Corporation/SL-SDK-Android'

        licenses {
            license {
                name = 'Apache License 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0'
            }
        }

        developers {
            developer {
                id = 'supersoftcorporation'
                name = 'SuperSoft Corporation'
                email = 'supersoft.pd@gmail.com'
            }
        }

        scm {
            url = 'https://github.com/Supersoft-Corporation/SL-SDK-Android'
            connection = 'scm:git:git://github.com/Supersoft-Corporation/SL-SDK-Android.git'
            developerConnection = 'scm:git:ssh://git@github.com/Supersoft-Corporation/SL-SDK-Android.git'
        }
    }
}